name: pull-ecr-image
author: jamie.briggs
description: Pulls the latest ECR image

inputs:
  role-to-assume:
    description: AWS role to assume for ECR access
    required: true
  aws-region:
    description: AWS region of the ECR registry
    required: true
  registry-account:
    description: AWS account ID hosting the ECR registry
    required: true
  repository:
    description: ECR repository name
    required: true
  image-tag:
    description: Docker image tag to pull
    required: true
  wait_for_tag:
    description: Wait for the image tag to exist in ECR before pulling
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Docker login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'

    - name: Pull Docker image
      shell: bash
      run: |
        set -euo pipefail
        
        IMAGE_URI="${{ inputs.registry-account }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.repository }}:${{ inputs.image-tag }}"
        MAX_RETRIES=30
        RETRY_DELAY=20

        if [[ "${{ inputs.wait_for_tag }}" == 'true' ]]; then
          attempt=0
          while (( attempt < MAX_RETRIES )); do
            ((++attempt))
            echo "Checking for image tag in ECR (attempt ${attempt}/${MAX_RETRIES}): ${IMAGE_URI}"

            if aws ecr describe-images \
              --repository-name "${{ inputs.repository }}" \
              --registry-id "${{ inputs.registry-account }}" \
              --image-ids "imageTag=${{ inputs.image-tag }}" \
              >/dev/null; then
              echo "Image tag is available in ECR"
              break
            fi

            if (( attempt < MAX_RETRIES )); then
              echo "Image tag not available yet, waiting ${RETRY_DELAY} seconds before retry..." >&2
              sleep "$RETRY_DELAY"
            fi
          done

          if (( attempt == MAX_RETRIES )); then
            echo "Timed out waiting for image tag '${{ inputs.image-tag }}' in repository '${{ inputs.repository }}'" >&2
            exit 1
          fi
        fi

        echo "Pulling image: ${IMAGE_URI}"
        if docker pull "$IMAGE_URI"; then
          echo "Successfully pulled image"
          exit 0
        fi

        echo "Failed to pull image '${IMAGE_URI}'" >&2
        exit 1